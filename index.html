<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic Volt — Tailwind Theme Playground</title>

    <!-- Font Awsome -->
    <script src="https://kit.fontawesome.com/e5a77a4fe1.js" crossorigin="anonymous"></script>
    <!-- Tailwind CSS CDN (v3 browser CDN). For a quick standalone demo. -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: use these font families in Tailwind config below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kinetic: {
                            primary: '#00C2E0',
                            secondary: '#00E676',
                            tertiary: '#0A0E17',
                            neutral: '#647488',
                            canvas: '#1B1D20',
                            panel: '#E3EDFF',
                            panelSoft: '#D5E4FF',
                            ink: '#102033',
                            muted: '#7D8999',
                            line: '#C5D8F6'
                        }
                    },
                    fontFamily: {
                        display: ['Sora', 'sans-serif'],
                        body: ['Hanken Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    boxShadow: {
                        glow: '0 0 24px rgba(0, 194, 224, .22)'
                    },
                    borderRadius: {
                        panel: '18px'
                    }
                }
            }
        };
    </script>
</head>

<body>


    <nav class="py-4 px-8 flex items-center justify-between shadow-xl">
        <!-- Logo -->
        <div id=" logo" class="flex items-center justify-center space-x-3">
            <div class="bg-kinetic-primary h-10 w-10 flex items-center justify-center rounded-md">
                <i class="fa-solid fa-bolt text-white"></i>
            </div>
            <h1 class="text-2xl font-bold font-display">
                VOLTRA
            </h1>
        </div>

        <!-- Menu Items -->
        <ul class="hidden md:flex items-center space-x-6">
            <li
                class="text-sm rounded-sm uppercase font-mono hover:bg-kinetic-primary p-2.5 duration-300 ease-in-out hover:text-white">
                <a href="#">Models</a>
            </li>
            <li
                class="text-sm rounded-sm uppercase font-mono hover:bg-kinetic-primary p-2.5 duration-300 ease-in-out hover:text-white">
                <a href="#">Feautures</a>
            </li>
            <li
                class="text-sm rounded-sm uppercase font-mono hover:bg-kinetic-primary p-2.5 duration-300 ease-in-out hover:text-white">
                <a href="#">Specs</a>
            </li>
            <li
                class="text-sm rounded-sm uppercase font-mono hover:bg-kinetic-primary p-2.5 duration-300 ease-in-out hover:text-white">
                <a href="#">Gallery</a>
            </li>
            <li
                class="text-sm rounded-sm uppercase font-mono hover:bg-kinetic-primary p-2.5 duration-300 ease-in-out hover:text-white">
                <a href="#">Contact</a>
            </li>
        </ul>

        <!-- Profile Section -->
        <div class="flex items-center justify-center space-x-8">
            <button
                class="hidden md:block bg-kinetic-primary p-2 px-6 rounded-md font-semibold font-mono text-white">Book
                Test
                Ride</button>
            <div
                class="h-8 w-8 bg-kinetic-panel flex items-center justify-center cursor-pointer rounded-full border border-gray-300 hover:border-gray-500 duration-300 ease-in-out">
                <i class="fa-regular fa-user text-sm"></i>
            </div>
        </div>

    </nav>

</body>

</html>
