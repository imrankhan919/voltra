<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic Volt — Tailwind Theme Playground</title>

    <!-- Font Awsome -->
    <script src="https://kit.fontawesome.com/e5a77a4fe1.js" crossorigin="anonymous"></script>
    <!-- Tailwind CSS CDN (v3 browser CDN). For a quick standalone demo. -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: use these font families in Tailwind config below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kinetic: {
                            primary: '#00C2E0',
                            secondary: '#00E676',
                            tertiary: '#0A0E17',
                            neutral: '#647488',
                            canvas: '#1B1D20',
                            panel: '#E3EDFF',
                            panelSoft: '#D5E4FF',
                            ink: '#102033',
                            muted: '#7D8999',
                            line: '#C5D8F6'
                        }
                    },
                    fontFamily: {
                        display: ['Sora', 'sans-serif'],
                        body: ['Hanken Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    boxShadow: {
                        glow: '0 0 24px rgba(0, 194, 224, .22)'
                    },
                    borderRadius: {
                        panel: '18px'
                    }
                }
            }
        };
    </script>
</head>

<body>


    

    <!-- Hero Section -->
    <div class="p-16 min-h-[90vh] bg-kinetic-panel flex flex-col-reverse md:flex-row items-center justify-center">

        <!-- Text Section -->
        <div class="w-full md:w-2/4">
            <div>
                <p class="font-mono bg-white border border-gray-300 p-1 rounded-full text-center text-sm w-60">2025
                    Hypersport
                    Flagship</p>
                <h1 class="text-5xl md:text-6xl font-bold font-display my-4 text-black">Silent Power.</h1>
                <h1 class="text-5xl md:text-6xl font-bold font-display my-4 text-kinetic-primary">Pure Speed.</h1>
                <p class="font-semibold text-base md:text-lg font-kinetic-muted font-body my-4">Zero emissions. Infinite
                    adrenaline.
                    Experience 220 horsepower of
                    instant
                    torque wrapped in an
                    aerospace-grade carbon fiber chassis.</p>
                <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
                    <button
                        class="bg-kinetic-primary py-2 md:py-4 px-2 w-full md:w-1/2  hover:bg-kinetic-panel hover:border-2 hover:border-gray-300 hover:text-black duration-300 rounded-md text-lg text-white font-bold font-mono">
                        Pre-Order Now
                    </button>
                    <button
                        class="bg-kinetic-panel py-2 md:py-4 px-2 w-full md:w-1/2 rounded-md border-2 border-gray-300 hover:bg-kinetic-primary hover:text-white duration-300 text-lg text-black font-bold font-mono">
                        <i class="fa-solid fa-circle-play text-kinetic-primary"></i> Watch Video
                    </button>
                </div>
            </div>
        </div>

        <!-- Image Section -->
        <div class="w-full mb-16 md:mb-0 md:w-3/5 flex items-center justify-center">
            <img class="md:ml-8" src="./assets/hero.png" alt="">
        </div>


    </div>




</body>

</html>
